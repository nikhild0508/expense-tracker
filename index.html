<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expense Tracker</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    
<header>
        <h1>Monthly Expense Tracker</h1>
        <p>Your Monthly Expense calculator which will help you to manage expenses better and make informed financial decisions. </p>
</header>

    <main>

        <section>
            <form id = "budgetForm">
              <label for = "budget">Set Your Monthly Expense :</label>
              <input
               type = "number"
               id = "budget"
                name = "budget"
                placeholder = "Enter Your Budget Here !" 
                min = "0"
                required >
              <button> Save Amount </button>
        </form>
        </section>
        
        <section>
            <form id = "expenseForm">
            <h2>Add Expenses ! </h2>
                <label for  = "expenseName"> Expense Name :  </label>
            <input
             type = "text" 
            id = "expenseName"
            name = "expenseName" 
            placeholder = "Expense Name Here !" >

            <label for = "price">Amount Spent </label>
            <input
             type = "number" 
            id = "price"
             name = "price" 
            placeholder = " Enter Price here "
            min = "1"
            required >

                            <h3>Select Type Of Expense</h3>
                <select name = "expenseType" id = "expensetype" required>
                    <option value = "" selected disabled> Select your Expense  </option>
                    <option> Food </option>
                    <option> Transportation  </option>
                    <option> Entertainment  </option>
                    <option> Shopping </option>
                    <option> Others </option>
                </select>

            <br>

            <button type = "Submit"> Add expense </button>
        </form>
        <section>
        <br>
         <section>
            <h2> Your Expense History</h2>

        <p id="emptyMessage">No expenses added yet.</p>
        <div id="expenseHistory"></div>   
         

        </section>
    </main>
    </body>
</html>
